name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore folder structure (one-time)
        run: |
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then
            move() { local dest="$1"; shift; mkdir -p "$dest"; for f in "$@"; do git mv "$f" "$dest/$f"; done; }
            move lib main.dart app.dart
            move lib/core app_theme.dart date_utils.dart
            move lib/data database_helper.dart planner_repository.dart
            move lib/data/models daily_task.dart day_summary.dart journal_entry.dart task_template.dart
            move lib/state settings_controller.dart today_controller.dart
            move lib/ui home_shell.dart
            move lib/ui/screens day_detail_screen.dart history_screen.dart journal_screen.dart routine_screen.dart settings_screen.dart today_screen.dart
            move lib/ui/widgets dialogs.dart month_calendar.dart progress_card.dart star_rating.dart task_form_sheet.dart
            move test widget_test.dart
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Move source files into lib/ and test/ folders"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Generate Android platform files (first build only)
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name yawmi --org com.hassan --platforms android
          fi
          sed -i 's/android:label="[^"]*"/android:label="يومي"/' android/app/src/main/AndroidManifest.xml

      - name: Install the project's fixed signing key
        run: |
          targets="$HOME/.android"
          [ -n "${ANDROID_USER_HOME:-}" ] && targets="$targets $ANDROID_USER_HOME"
          [ -n "${ANDROID_SDK_HOME:-}" ] && targets="$targets $ANDROID_SDK_HOME/.android"
          for dir in $targets; do
            mkdir -p "$dir"
            cp yawmi-signing.keystore "$dir/debug.keystore"
          done

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log

      - name: Run unit tests
        run: flutter test 2>&1 | tee -a build.log

      - name: Build release APK
        run: flutter build apk --release --build-name="$APP_VERSION" --build-number=${{ github.run_number }} 2>&1 | tee -a build.log

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "yawmi-$APP_VERSION.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: yawmi-${{ env.APP_VERSION }}
          path: yawmi-${{ env.APP_VERSION }}.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Yawmi ${{ env.APP_VERSION }}
          body: Download the APK on your phone and open it to install or update.
          files: yawmi-${{ env.APP_VERSION }}.apk
          make_latest: true

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build #${{ github.run_number }} failed."
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Error lines"
            echo '~~~'
            grep -n -i -E "error|exception|failed|what went wrong" build.log 2>/dev/null | head -n 80 || true
            echo '~~~'
            echo "### Log tail"
            echo '~~~'
            tail -n 150 build.log 2>/dev/null || echo "build.log not found (failure happened before the build steps)"
            echo '~~~'
          } > report.md
          gh issue create --repo "${{ github.repository }}" --title "Build #${{ github.run_number }} failed" --body-file report.md
